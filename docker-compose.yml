services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rootedu
      POSTGRES_USER: rootedu
      POSTGRES_PASSWORD: rootedu_dev_only
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootedu -d rootedu"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev-rootedu
      MINIO_ROOT_PASSWORD: dev-only-change-me
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
volumes:
  postgres_data:
  minio_data:
