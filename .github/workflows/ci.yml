name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir /tmp/rootedu-android-export

  android-apk:
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: APP_VARIANT=development npx expo prebuild --platform android --no-install
      - name: Diagnose Expo Android autolinking metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/rootedu-autolinking.json
          node - <<'NODE'
          const data = require('/tmp/rootedu-autolinking.json');
          for (const [index, module] of (data.modules ?? []).entries()) {
            console.log(JSON.stringify({
              index,
              packageName: module.packageName,
              packageVersion: module.packageVersion,
              projects: (module.projects ?? []).map(project => ({
                name: project.name,
                path: project.path,
                publication: project.publication,
                shouldUsePublicationScriptPath: project.shouldUsePublicationScriptPath,
              })),
            }));
          }
          NODE
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rootedu-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
