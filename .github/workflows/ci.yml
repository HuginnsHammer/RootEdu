name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir /tmp/rootedu-android-export

  android-apk:
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      # Do not set APP_VARIANT=development: the distributed APK must not
      # depend on Metro or the Expo development client.
      - name: Generate standalone Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify APK contains a packaged JavaScript bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.*\.bundle'
      - uses: actions/upload-artifact@v4
        with:
          name: rootedu-android-standalone-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
