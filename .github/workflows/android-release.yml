name: Build shareable RootEdu Android APK

on:
  push:
    tags:
      - "test-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing test-v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - name: Validate release tag and OTA trust configuration
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: |
          [[ "$RELEASE_TAG" == test-v* ]] || { echo "Release tag must start with test-v"; exit 1; }
          test -n "$EXPO_PUBLIC_EAS_PROJECT_ID" || { echo "Missing EXPO_PUBLIC_EAS_PROJECT_ID repository variable"; exit 1; }
          test -s mobile/certs/rootedu-ota-certificate.pem || { echo "Missing committed OTA public certificate"; exit 1; }
      - name: Build test APK
        working-directory: mobile
        env:
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: |
          npm install --no-audit --no-fund
          APP_VARIANT=development npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Create checksum
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "RootEdu-$RELEASE_TAG.apk"
          sha256sum "RootEdu-$RELEASE_TAG.apk" > "RootEdu-$RELEASE_TAG.apk.sha256"
      - name: Publish downloadable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "RootEdu-$RELEASE_TAG.apk" \
            "RootEdu-$RELEASE_TAG.apk.sha256" \
            --title "RootEdu $RELEASE_TAG — Android tester APK" \
            --notes "Beta testing APK. Development build; not for production use. Check the attached SHA-256 checksum before installing."
