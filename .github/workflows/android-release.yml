name: Build shareable RootEdu Android APK

on:
  push:
    tags:
      - "test-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing test-v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build test APK
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          APP_VARIANT=development npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Create checksum
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk RootEdu-${GITHUB_REF_NAME}.apk
          sha256sum RootEdu-${GITHUB_REF_NAME}.apk > RootEdu-${GITHUB_REF_NAME}.apk.sha256
      - name: Publish downloadable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "RootEdu-${GITHUB_REF_NAME}.apk" \
            "RootEdu-${GITHUB_REF_NAME}.apk.sha256" \
            --title "RootEdu ${GITHUB_REF_NAME} — Android tester APK" \
            --notes "Beta testing APK. Development build; not for production use. Check the attached SHA-256 checksum before installing."
